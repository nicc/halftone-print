name: Publish

# Push a version tag (npm version patch|minor|major && git push --follow-tags) to publish.
# Uses npm trusted publishing (OIDC): no token stored; provenance is attached automatically.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      - run: npm ci
      - name: Tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm publish # prepublishOnly: typecheck, all tests, build
